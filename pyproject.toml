[project]
name = "efood-api"
version = "1.0.0"
description = "Transactional food delivery API with Django REST Framework"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asgiref==3.13.0",
    "attrs==26.1.0",
    "dj-database-url==3.1.2",
    "Django==5.2.19",
    "django-cors-headers==4.9.0",
    "djangorestframework==3.18.3",
    "djangorestframework_simplejwt==5.5.1",
    "drf-spectacular==0.30.0",
    "gunicorn==27.0.1",
    "inflection==0.5.1",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "psycopg==3.3.9",
    "psycopg-binary==3.3.9",
    "PyJWT==2.15.1",
    "PyYAML==6.0.3",
    "referencing==0.37.0",
    "rpds-py==2026.9.1",
    "sqlparse==0.6.1",
    "typing_extensions==4.16.0",
    "uritemplate==4.2.0",
    "whitenoise==6.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.coverage.run]
source = ["shop"]
omit = ["*/migrations/*", "*/management/*", "*/admin.py"]
