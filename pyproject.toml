[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.coverage.run]
source = ["shop"]
omit = ["*/migrations/*", "*/management/*", "*/admin.py"]
