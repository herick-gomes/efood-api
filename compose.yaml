services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: efood
      POSTGRES_USER: efood
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efood -d efood"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://efood:${POSTGRES_PASSWORD}@db:5432/efood
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
volumes:
  postgres_data:
