name: Efood API CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: efood
          POSTGRES_USER: efood
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U efood -d efood"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: '1'
      DATABASE_URL: postgres://efood:ci-only-password@localhost:5432/efood
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify deployment dependencies in a clean environment
        run: |
          pip install uv==0.13.5
          uv venv /tmp/efood-deploy-check --python 3.12
          uv pip install --python /tmp/efood-deploy-check/bin/python -r pyproject.toml
          /tmp/efood-deploy-check/bin/python manage.py check
          python scripts/check_dependencies.py
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py check && python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py collectstatic --noinput
      - run: pytest --cov=shop --cov-fail-under=90 --cov-report=term-missing
      - run: python manage.py spectacular --file /tmp/schema.yml --validate --fail-on-warn
